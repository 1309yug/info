<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Cloud Vault</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOGIN -->
  <section id="login-screen">
    <div class="login-box">
      <h1>Secure Cloud Vault</h1>
      <p>Sign in to access your files</p>

      <form id="login-form">
        <input
          id="login-password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button id="login-btn" type="submit">
          Sign In
        </button>

        <div id="login-message"></div>
      </form>
    </div>
  </section>


  <!-- DASHBOARD -->
  <section id="dashboard">

    <header class="topbar">
      <div>
        <h1>Secure Cloud Vault</h1>
        <p>
          Signed in as
          <strong id="username-display">User</strong>
        </p>
      </div>

      <button id="logout-btn" type="button">
        Logout
      </button>
    </header>


    <main>

      <!-- UPLOAD -->
      <section class="panel">
        <h2>Upload Files</h2>

        <input
          id="file-input"
          type="file"
          multiple
        >

        <div id="selected-files"></div>

        <button id="upload-btn" type="button">
          Upload Files
        </button>

        <p id="upload-status"></p>
      </section>


      <!-- FILES -->
      <section class="panel">
        <h2>My Files</h2>

        <div id="files-grid"></div>
      </section>


      <!-- ADMIN -->
      <section
        id="user-management"
        class="panel"
        style="display:none;"
      >

        <h2>User Management</h2>

        <form id="create-user-form">

          <input
            id="new-username"
            type="text"
            placeholder="Username"
            required
          >

          <input
            id="new-email"
            type="email"
            placeholder="Email"
            required
          >

          <select id="new-role">
            <option value="user">User</option>
            <option value="owner">Administrator</option>
          </select>

          <input
            id="new-password"
            type="password"
            placeholder="Password"
            required
          >

          <button type="submit">
            Create User
          </button>

        </form>

        <div id="users-table"></div>

      </section>

    </main>

  </section>

  <script src="script.js"></script>
</body>
</html>
