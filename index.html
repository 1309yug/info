<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Cloud Vault</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOGIN -->
  <section id="loginPage" class="login-page">
    <div class="login-box">
      <h1>Secure Cloud Vault</h1>
      <p class="subtitle">Sign in to continue</p>

      <form id="loginForm">
        <input
          type="password"
          id="loginPassword"
          placeholder="Enter password"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginButton">
          Sign In
        </button>
      </form>

      <p id="loginStatus" class="status"></p>
    </div>
  </section>


  <!-- DASHBOARD -->
  <section id="dashboardPage" class="dashboard-page hidden">

    <header class="topbar">
      <div>
        <h1>Secure Cloud Vault</h1>
        <p id="signedInAs"></p>
      </div>

      <button id="logoutButton" class="logout-button">
        Logout
      </button>
    </header>


    <main class="container">

      <!-- UPLOAD -->
      <section class="panel">
        <h2>Upload Files</h2>

        <div id="dropZone" class="drop-zone">
          <p>Drag & Drop files here</p>
          <span>or</span>

          <label class="file-label">
            Choose Files
            <input
              type="file"
              id="fileInput"
              multiple
              hidden
            >
          </label>
        </div>

        <div id="selectedFiles"></div>

        <button id="uploadButton" class="primary-button">
          Upload Files
        </button>

        <p id="uploadStatus" class="status"></p>
      </section>


      <!-- FILES -->
      <section class="panel">
        <div class="section-header">
          <h2>My Files</h2>

          <button id="refreshFilesButton" class="secondary-button">
            Refresh
          </button>
        </div>

        <div id="fileGrid" class="file-grid"></div>

        <p id="filesStatus" class="status"></p>
      </section>


      <!-- USER MANAGEMENT -->
      <section id="userManagement" class="panel hidden">

        <h2>User Management</h2>

        <form id="createUserForm" class="user-form">

          <input
            type="text"
            id="newUsername"
            placeholder="Username"
            required
          >

          <input
            type="email"
            id="newEmail"
            placeholder="Email"
            required
          >

          <select id="newRole">
            <option value="user">User</option>
            <option value="owner">Owner</option>
          </select>

          <input
            type="text"
            id="newPassword"
            placeholder="Password - any non-empty length"
            required
          >

          <button type="submit" class="primary-button">
            Create User
          </button>

        </form>

        <p id="userStatus" class="status"></p>

        <div id="userList"></div>

      </section>

    </main>
  </section>


  <!-- DOWNLOAD MODAL -->
  <div id="downloadModal" class="modal hidden">
    <div class="modal-box">

      <h2>Download File</h2>

      <p id="downloadFileName"></p>

      <button id="confirmDownload" class="primary-button">
        Download
      </button>

      <button id="cancelDownload" class="secondary-button">
        Cancel
      </button>

    </div>
  </div>


  <script src="script.js"></script>

</body>
</html>
