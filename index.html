<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Secure Cloud Vault</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- ================= LOGIN ================= -->

  <section id="loginPage" class="login-page">

    <div class="login-box">

      <h1>Secure Cloud Vault</h1>

      <p class="subtitle">
        Secure file storage
      </p>

      <form id="loginForm">

        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="off"
          required
        >

        <button type="submit">
          Sign In
        </button>

      </form>

      <div id="status"></div>

    </div>

  </section>


  <!-- ================= DASHBOARD ================= -->

  <section id="dashboard" style="display:none;">

    <header class="topbar">

      <div>
        <h2>Secure Cloud Vault</h2>

        <span>
          Signed in as
          <strong id="currentUsername"></strong>
        </span>
      </div>

      <button
        type="button"
        onclick="logout()"
      >
        Logout
      </button>

    </header>


    <main class="container">


      <!-- ================= UPLOAD ================= -->

      <section class="panel">

        <h2>Upload Files</h2>

        <form id="uploadForm">

          <div
            id="dropZone"
            class="drop-zone"
          >

            <p>
              Drag & drop files here
            </p>

            <span>
              or click to select
            </span>

            <input
              id="fileInput"
              type="file"
              multiple
              hidden
            >

          </div>

          <button type="submit">
            Upload
          </button>

        </form>

      </section>


      <!-- ================= FILES ================= -->

      <section class="panel">

        <div class="section-header">

          <h2>My Files</h2>

          <button
            type="button"
            onclick="loadFiles()"
          >
            Refresh
          </button>

        </div>

        <div id="fileList"></div>

      </section>


      <!-- ================= USER MANAGEMENT ================= -->

      <section
        id="userManagement"
        class="panel"
        style="display:none;"
      >

        <h2>User Management</h2>


        <form id="createUserForm">

          <input
            id="newUsername"
            type="text"
            placeholder="Username"
            autocomplete="off"
            required
          >

          <input
            id="newEmail"
            type="email"
            placeholder="Email"
            required
          >

          <select id="newRole">

            <option value="user">
              User
            </option>

            <option value="owner">
              Owner
            </option>

          </select>

          <input
            id="newPassword"
            type="text"
            placeholder="Password"
            autocomplete="off"
            required
          >

          <button type="submit">
            Create User
          </button>

        </form>


        <div class="section-header">

          <h3>Users</h3>

          <button
            type="button"
            onclick="loadUsers()"
          >
            Refresh
          </button>

        </div>

        <div id="userList"></div>

      </section>

    </main>

  </section>


  <script src="script.js"></script>

</body>
</html>
