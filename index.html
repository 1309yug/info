<html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Cloud Vault</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: min(360px, 90%);
      padding: 30px;
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 12px 35px #0005;
    }

    h1 { text-align: center; font-size: 25px; }
    p { text-align: center; color: #cbd5e1; }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border: 0;
      border-radius: 8px;
      font-size: 15px;
    }

    input { background: #334155; color: white; }
    input::placeholder { color: #cbd5e1; }

    button {
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #message {
      min-height: 20px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="login-box">
    <h1>Secure Cloud Vault</h1>
    <p>Sign in to access your files</p>

    <form id="loginForm">
      <input id="email" type="email"
             placeholder="Email address"
             autocomplete="username" required>

      <input id="password" type="password"
             placeholder="Password"
             autocomplete="current-password" required>

      <button id="loginButton" type="submit">Sign In</button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from
      "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJtbvlNz-a2_i3wHx9bO-1FWy3naisBzk",
      authDomain: "cloud-vault-71d1b.firebaseapp.com",
      projectId: "cloud-vault-71d1b",
      appId: "1:399415147497:web:b54237caab6b7e31a66978"
    };

    const DRIVE_LINK =
      "https://drive.google.com/drive/folders/1juspfabc5hkzZIXXKEF_BXi8fqFqEIze?usp=sharin
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      message.textContent = "Signing in...";

      try {
        await signInWithEmailAndPassword(auth, email, password);

        // This only opens Drive; Drive permissions still apply.
        window.location.href = DRIVE_LINK;

      } catch (error) {
        message.textContent =
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
            ? "Incorrect email or password."
            : error.code === "auth/too-many-requests"
            ? "Too many attempts. Please try again later."
            : "Sign-in failed. Check your settings and try again.";

        button.disabled = false;
      }
    });
  </script>
</body>
</html>
